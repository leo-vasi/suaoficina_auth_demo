<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Recuperar Senha — SecureAuth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #fff;
    border: 1px solid #e0e0d8;
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .brand { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #888; margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.5; }

  .step-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #888;
    background: #f5f5f0;
    border: 1px solid #e0e0d8;
    border-radius: 20px;
    padding: 3px 10px;
    display: inline-block;
    margin-bottom: 16px;
  }

  label { display: block; font-size: 13px; font-weight: 500; color: #444; margin-bottom: 6px; }

  input {
    width: 100%;
    border: 1px solid #d8d8d0;
    border-radius: 8px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 14px;
    color: #1a1a1a;
    background: #fafafa;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    margin-bottom: 18px;
  }
  input:focus { border-color: #1a1a1a; background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }

  .btn-primary {
    width: 100%;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-primary:hover { background: #333; }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { background: #aaa; cursor: not-allowed; }

  .msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; display: none; }
  .msg.error   { background: #fff2f2; border: 1px solid #fca5a5; color: #b91c1c; display: block; }
  .msg.success { background: #f0fdf4; border: 1px solid #86efac; color: #15803d; display: block; }

  .token-box {
    margin-top: 14px;
    background: #fffbeb;
    border: 1px solid #fcd34d;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    display: none;
  }
  .token-box .token-title { font-weight: 600; color: #92400e; margin-bottom: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .token-box .token-value { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #78350f; word-break: break-all; }

  .divider { border: none; border-top: 1px solid #e8e8e0; margin: 24px 0; }

  .links { margin-top: 22px; text-align: center; font-size: 13px; color: #666; }
  .links a { color: #1a1a1a; font-weight: 500; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
  .links a:hover { border-bottom-color: #1a1a1a; }

  /* Passo 2 desabilitado inicialmente */
  #step2 { opacity: 0.4; pointer-events: none; transition: opacity 0.3s; }
  #step2.enabled { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">SecureAuth</div>
  <h1>Recuperar senha</h1>
  <p class="subtitle">Informe seu e-mail para gerar um token e redefina sua senha.</p>

  <!-- PASSO 1 -->
  <div id="step1">
    <div class="step-label">Passo 1 — Solicitar token</div>
    <form id="forgotForm">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email"/>
      <button type="submit" class="btn-primary" id="btnForgot">Solicitar token</button>
    </form>
    <div class="msg" id="msgForgot"></div>
    <div class="token-box" id="tokenBox">
      <div class="token-title">Token de recuperação</div>
      <div class="token-value" id="tokenValue"></div>
    </div>
  </div>

  <hr class="divider"/>

  <!-- PASSO 2 -->
  <div id="step2">
    <div class="step-label">Passo 2 — Nova senha</div>
    <form id="resetForm">
      <label for="token">Token</label>
      <input type="text" id="token" placeholder="Cole o token aqui" required/>

      <label for="newPassword">Nova senha</label>
      <input type="password" id="newPassword" placeholder="••••••••" required autocomplete="new-password"/>

      <button type="submit" class="btn-primary" id="btnReset">Redefinir senha</button>
    </form>
    <div class="msg" id="msgReset"></div>
  </div>

  <hr class="divider"/>
  <div class="links"><a href="index.html">← Voltar para o login</a></div>
</div>

<script type="module">
  import { forgotPassword, resetPassword } from './api.js';

  // ── Passo 1 ──────────────────────────────────────────────
  const forgotForm = document.getElementById('forgotForm');
  const msgForgot  = document.getElementById('msgForgot');
  const btnForgot  = document.getElementById('btnForgot');
  const tokenBox   = document.getElementById('tokenBox');
  const tokenValue = document.getElementById('tokenValue');
  const step2      = document.getElementById('step2');

  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();

    btnForgot.disabled = true;
    btnForgot.textContent = 'Enviando...';
    msgForgot.className = 'msg';
    tokenBox.style.display = 'none';

    try {
      await forgotPassword(email);
      msgForgot.className = 'msg success';
      msgForgot.textContent = 'Token enviado para o seu e-mail! Cole-o no campo abaixo.';
      document.getElementById('token').value = '';
      step2.classList.add('enabled');
    } catch (err) {
      msgForgot.className = 'msg error';
      msgForgot.textContent = err.message;
    } finally {
      btnForgot.disabled = false;
      btnForgot.textContent = 'Solicitar token';
    }
  });

  // ── Passo 2 ──────────────────────────────────────────────
  const resetForm = document.getElementById('resetForm');
  const msgReset  = document.getElementById('msgReset');
  const btnReset  = document.getElementById('btnReset');

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const token       = document.getElementById('token').value.trim();
    const newPassword = document.getElementById('newPassword').value;

    btnReset.disabled = true;
    btnReset.textContent = 'Redefinindo...';
    msgReset.className = 'msg';

    try {
      const resposta = await resetPassword(token, newPassword);
      msgReset.className = 'msg success';
      msgReset.textContent = `${resposta} Redirecionando para o login...`;
      setTimeout(() => window.location.href = 'index.html', 2000);
    } catch (err) {
      msgReset.className = 'msg error';
      msgReset.textContent = err.message;
      btnReset.disabled = false;
      btnReset.textContent = 'Redefinir senha';
    }
  });
</script>
</body>
</html>

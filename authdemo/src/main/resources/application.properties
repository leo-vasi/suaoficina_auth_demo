# Nome da aplicação Spring Boot
# Este identificador é usado em logs, atuação (actuator) e descoberta de serviços
spring.application.name=authdemo

# ============================================================
# CONFIGURAÇÕES DO BANCO DE DADOS (PostgreSQL)
# ============================================================

# URL de conexão com o banco de dados PostgreSQL
# Formato: jdbc:postgresql://host:porta/nome_do_banco
# localhost: o banco está rodando na mesma máquina que a aplicação
# 5432: porta padrão do PostgreSQL
# db_suaoficina: nome do banco de dados que deve existir previamente no PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_suaoficina

# Nome de usuário para autenticação no PostgreSQL
# Deve ter permissões de leitura, escrita e criação de tabelas (para ddl-auto=update)
# Substitua pelo seu usuário real do banco de dados (ex: postgres, admin, etc.)
spring.datasource.username=SEU_USUARIO

# Senha correspondente ao usuário do banco de dados
# ATENÇÃO: Em produção, nunca armazene senhas em texto puro no arquivo de propriedades.
# Utilize variáveis de ambiente ou serviços de segredos (ex: Spring Cloud Vault, AWS Secrets Manager)
spring.datasource.password=SUA_SENHA

# ============================================================
# CONFIGURAÇÕES DE E-MAIL (SMTP do Gmail)
# ============================================================
# Estas configurações são usadas pelo JavaMailSender para enviar e-mails
# de recuperação de senha. O serviço UserService utiliza este componente.

# Servidor SMTP do Gmail - responsável por enviar os e-mails
spring.mail.host=smtp.gmail.com

# Porta do servidor SMTP com TLS (Transport Layer Security)
# 587 é a porta padrão para STARTTLS (conexão normal que sobe para TLS)
# Alternativa seria 465 para SSL direto, mas 587 é a recomendada atualmente
spring.mail.port=587

# E-mail remetente que irá enviar os tokens de recuperação
# Deve ser um endereço Gmail válido (ex: suaoficina.app@gmail.com)
spring.mail.username=SEU_EMAIL

# Senha de aplicativo (App Password) gerada no Google Account
# ATENÇÃO: Não é a senha normal do Gmail. Para contas com verificação em duas etapas,
# é necessário gerar uma "Senha de Aplicativo" específica para este serviço.
# Acesse: Conta Google > Segurança > Senhas de aplicativo
spring.mail.password=SUA_SENHA_DE_APP

# Habilita autenticação no servidor SMTP
# true: o servidor exigirá usuário e senha válidos
spring.mail.properties.mail.smtp.auth=true

# Habilita TLS (STARTTLS) - converte a conexão SMTP comum em uma conexão criptografada
# true: solicita ao servidor que utilize TLS após o handshake inicial
# Sem esta opção, o e-mail seria enviado em texto puro (inseguro)
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# CONFIGURAÇÕES DO JPA (Java Persistence API) E HIBERNATE
# ============================================================

# Estratégia de geração automática do esquema do banco de dados
# update: atualiza o esquema existente ou cria tabelas novas sem destruir dados.
# Outras opções possíveis:
#   - create: apaga todas as tabelas e recria do zero (perde dados)
#   - create-drop: igual ao create, mas apaga as tabelas ao encerrar a aplicação
#   - validate: apenas verifica se o esquema está compatível com as entidades
#   - none: não faz nenhuma alteração automática
# ATENÇÃO: update em produção pode ser arriscado. O ideal é usar ferramentas de migração
# como Flyway ou Liquibase em ambientes produtivos.
spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL geradas pelo Hibernate no console
# Útil para desenvolvimento e depuração. Em produção, deve ser false ou configurado
# para logging específico, pois exibir cada consulta pode sobrecarregar os logs.
spring.jpa.show-sql=true

# Define o dialeto SQL que o Hibernate deve usar para gerar consultas otimizadas
# para o PostgreSQL. O dialeto informa ao Hibernate quais tipos de dados, funções
# e sintaxe específica usar para o banco de dados em questão.
# Sem esta configuração, o Hibernate pode gerar SQL incompatível com o PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect